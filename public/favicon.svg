<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2422" />
      <stop offset="100%" stop-color="#041211" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72e0c7" />
      <stop offset="100%" stop-color="#3bbd9f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background block -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#1a423d" stroke-width="8"/>

  <!-- Blueprint grid overlay -->
  <path d="M0 128h512M0 256h512M0 384h512M128 0v512M256 0v512M384 0v512" stroke="#133632" stroke-width="2" opacity="0.6"/>

  <!-- AIoT Wave Signal -->
  <path d="M64 340c60-80 100-160 160-80s100 120 160-40 60-60 64-60" fill="none" stroke="#d39a43" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <path d="M64 256c50-100 90-120 140-30s90 140 160 20 70-50 84-50" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Sensing Node Circles -->
  <circle cx="204" cy="226" r="14" fill="#0b2422" stroke="#72e0c7" stroke-width="6"/>
  <circle cx="344" cy="386" r="14" fill="#0b2422" stroke="#72e0c7" stroke-width="6"/>
  <circle cx="324" cy="260" r="10" fill="#d39a43"/>

  <!-- Monogram Box -->
  <rect x="116" y="140" width="280" height="232" rx="28" fill="#e8f4ef" stroke="#72e0c7" stroke-width="6"/>

  <!-- MH Text Monogram -->
  <text x="256" y="296" fill="#0b2422" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Mono', 'Segoe UI', Roboto, sans-serif" font-size="140" font-weight="900" text-anchor="middle" letter-spacing="-2">MH</text>

  <!-- Underline status bar -->
  <rect x="156" y="324" width="200" height="12" rx="6" fill="#0f6f5f"/>
  <circle cx="340" cy="330" r="6" fill="#d39a43"/>
</svg>
